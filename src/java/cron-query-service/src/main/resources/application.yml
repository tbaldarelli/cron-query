server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cron-query-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cronquery:
  crontab:
    sources:
      - type: user
        enabled: true
      - type: system
        path: /etc/crontab
        enabled: true
      - type: directory
        path: /etc/cron.d
        enabled: true
      - type: file
        path: ${CRONTAB_TEST_FILE:test_crontab.txt}
        enabled: true
        fallback: true
  groovy-jar:
    version: 1.2.2

logging:
  level:
    com.cronquery: INFO
    org.springframework: INFO
