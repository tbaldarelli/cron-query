plugins {
    id 'groovy'
    id 'application'
}

group = 'com.cronquery'
version = '1.1.2'

repositories {
    mavenCentral()
}

// Custom source directories to match project structure
sourceSets {
    main {
        groovy {
            srcDirs = ['src/groovy/cron-query']
        }
    }
    test {
        groovy {
            srcDirs = ['src/groovy/test']
        }
    }
}

dependencies {
    // Groovy
    implementation 'org.apache.groovy:groovy-all:4.0.15'
    
    // Cron parsing
    implementation 'com.cronutils:cron-utils:9.2.1'
    
    // CLI argument parsing
    implementation 'info.picocli:picocli:4.7.5'
    implementation 'info.picocli:picocli-groovy:4.7.5'
    
    // YAML support (for potential config files)
    implementation 'org.yaml:snakeyaml:2.2'
    
    // Date/time utilities
    implementation 'joda-time:joda-time:2.12.5'
    
    // ANSI colors for terminal output
    implementation 'org.fusesource.jansi:jansi:2.4.1'
    
    // Logging implementation
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    
    // Testing with Spock
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.cronquery.Main'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

// Create executable JAR
jar {
    manifest {
        attributes 'Main-Class': 'com.cronquery.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
