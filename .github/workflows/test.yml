name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
      # NOTE: Python 3.7 fallback logic below is currently unused but preserved
      # for future use if 3.7 is added back to the matrix. Ubuntu-20.04 runner
      # capacity issues prevent testing 3.7 currently.
      continue-on-error: ${{ matrix.python-version == '3.7' }}
        
    - name: Install Python 3.7 via deadsnakes (fallback)
      if: matrix.python-version == '3.7' && failure()
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install python3.7 python3.7-venv python3.7-dev
        python3.7 -m pip install --upgrade pip
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run tests
      run: |
        pytest src/python/tests/ --cov=src/python/cron_query --cov-report=term-missing

  # Separate job for Windows testing (simpler matrix)
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run tests
      run: |
        pytest src/python/tests/ --cov=src/python/cron_query --cov-report=term-missing

  # Groovy/Gradle testing
  test-groovy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Run Groovy tests
      run: ./gradlew test
        
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        report_paths: 'build/test-results/test/TEST-*.xml'
        check_name: 'Groovy Test Results'
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: groovy-test-results
        path: build/reports/tests/test/

  # Groovy/Gradle testing on Windows
  test-groovy-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Run Groovy tests
      run: .\gradlew.bat test
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: groovy-test-results-windows
        path: build/reports/tests/test/

  # Spring Boot microservice testing
  test-spring-boot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build Groovy JAR
      run: ./gradlew build -x test
    
    - name: Copy Groovy JAR for Spring Boot
      run: |
        mkdir -p src/java/cron-query-service/lib
        cp build/libs/cron-query-groovy-*.jar src/java/cron-query-service/lib/
        
    - name: Run Maven tests
      working-directory: src/java/cron-query-service
      run: mvn test
        
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        report_paths: 'src/java/cron-query-service/target/surefire-reports/TEST-*.xml'
        check_name: 'Spring Boot Test Results'
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-test-results
        path: src/java/cron-query-service/target/surefire-reports/

  # Spring Boot microservice integration tests
  test-spring-boot-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build Groovy JAR
      run: ./gradlew build -x test
    
    - name: Copy Groovy JAR for Spring Boot
      run: |
        mkdir -p src/java/cron-query-service/lib
        cp build/libs/cron-query-groovy-*.jar src/java/cron-query-service/lib/
        
    - name: Build and run integration tests
      working-directory: src/java/cron-query-service
      run: mvn verify
        
    - name: Upload Integration Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-integration-test-results
        path: src/java/cron-query-service/target/failsafe-reports/
