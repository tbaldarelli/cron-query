name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write  # Required to create releases

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build Python distribution packages
      run: |
        python -m build
    
    - name: Build Groovy JAR
      run: |
        ./gradlew build -x test
    
    - name: Copy Groovy JAR for Spring Boot build
      run: |
        mkdir -p src/java/cron-query-service/lib
        cp build/libs/cron-query-groovy-*.jar src/java/cron-query-service/lib/
    
    - name: Build Spring Boot JAR
      working-directory: src/java/cron-query-service
      run: |
        mvn clean package -DskipTests
        
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Generate release notes
      id: release_notes
      run: |
        # Extract changelog section for this version if it exists
        if [ -f CHANGELOG.md ]; then
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "NOTES=Release ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Build Docker image
      working-directory: src/java/cron-query-service
      run: |
        docker build -t cron-query-service:${{ steps.get_version.outputs.VERSION }} .
        docker save cron-query-service:${{ steps.get_version.outputs.VERSION }} -o ../../cron-query-service-docker-${{ steps.get_version.outputs.VERSION }}.tar
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
          build/libs/*.jar
          src/java/cron-query-service/target/cron-query-service-*.jar
          cron-query-service-docker-*.tar
        body: ${{ steps.release_notes.outputs.NOTES }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify artifacts
      run: |
        echo "Built packages:"
        ls -lh dist/
        echo ""
        echo "Package contents:"
        twine check dist/*
