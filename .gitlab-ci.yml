# Groovy/Gradle tests (Linux)
test_groovy:
  stage: test
  image: eclipse-temurin:21-jdk
  script:
    - ./gradlew test
  artifacts:
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
  only:
    - master
    - merge_requests

# Spring Boot microservice tests (Linux)
test_spring_boot:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd src/java/cron-query-service
    - mvn initialize
    - mvn test
  artifacts:
    reports:
      junit: src/java/cron-query-service/target/surefire-reports/TEST-*.xml
    paths:
      - src/java/cron-query-service/target/surefire-reports/
  only:
    - master
    - merge_requests

