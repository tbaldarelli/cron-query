stages:
  - test
  - release

# Python tests (Linux)
test_python:
  stage: test
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - pip install -e .[dev]
    - pytest src/python/tests/ --cov=src/python/cron_query --cov-report=term-missing
  only:
    - master
    - merge_requests

# Python tests (Windows)
# NOTE: Commented out because Windows runners are not available on this GitLab instance.
