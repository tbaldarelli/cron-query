# Build release artifacts
build_release:
  stage: release
  image: python:3.11
  before_script:
    - apt-get update && apt-get install -y openjdk-21-jdk maven
  script:
    - python -m pip install --upgrade pip build twine
    - python -m build
    - ./gradlew build -x test
    - cd src/java/cron-query-service && mvn clean package -DskipTests && cd ../../..
    - |
      VERSION=${CI_COMMIT_TAG#v}
      echo "Release version: $VERSION"
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
      - build/libs/*.jar
      - src/java/cron-query-service/target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Build Docker image for Spring Boot microservice
build_docker:
  stage: release
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - cd src/java/cron-query-service
    - docker build -t cron-query-service:${CI_COMMIT_TAG#v} .
    - docker save cron-query-service:${CI_COMMIT_TAG#v} -o ../../../cron-query-service-docker.tar
  artifacts:
    paths:
      - cron-query-service-docker.tar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Create GitLab release
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_release
      artifacts: true
    - job: build_docker
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  release:
    tag_name: $CI_COMMIT_TAG
    description: "See CHANGELOG.md for details."
    assets:
      links:
        - name: "Python wheel"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/dist?job=build_release"
        - name: "Groovy JAR"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/build/libs?job=build_release"
        - name: "Spring Boot JAR"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/src/java/cron-query-service/target?job=build_release"
        - name: "Docker Image"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/file/cron-query-service-docker.tar?job=build_docker"
